apiVersion: apps/v1
kind: Deployment
metadata:
  name: kontrollzentrum
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kontrollzentrum
  template:
    metadata:
      labels:
        app: kontrollzentrum
    spec:
      containers:
      - name: kontrollzentrum
        image: kontrollzentrum:5.0
        ports:
        - containerPort: 8000
        - containerPort: 8501
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kontrollzentrum-secrets
              key: openai-key
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kontrollzentrum-secrets
              key: stripe-key
---
apiVersion: v1
kind: Service
metadata:
  name: kontrollzentrum-service
spec:
  selector:
    app: kontrollzentrum
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
